# render.yaml — KingTrades NSE Momentum Bot
# Render.com deployment configuration
#
# SETUP STEPS:
#   1. Push this repo to GitHub
#   2. Go to https://render.com → New → Background Worker
#   3. Connect your GitHub repo
#   4. Render auto-detects this file
#   5. Add all REQUIRED env vars in Render Dashboard → Environment
#   6. Click "Deploy"
#
# The bot entry point is watchdog.py which:
#   - Auto-restarts main.py if it crashes
#   - Skips weekends and NSE holidays automatically
#   - Waits until 8:40 AM IST before starting each day

services:
  - type: worker
    name: kingtrades-bot
    runtime: python
    repo: https://github.com/lakshaytrades/kingtrades
    branch: claude/nse-momentum-groww-bot-hvkv9
    buildCommand: pip install -r requirements.txt
    startCommand: python watchdog.py
    plan: starter               # ₹700/month — 512MB RAM, always-on
    region: singapore           # Lowest latency to Indian markets / Groww API

    # ── Environment Variables ──────────────────────────────────
    # Non-secret defaults are set here.
    # SENSITIVE credentials must be added manually in Render Dashboard.
    envVars:

      # ── Timezone (CRITICAL — server is UK UTC) ──────────────
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: TZ
        value: Asia/Kolkata

      # ── Logging ─────────────────────────────────────────────
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_DIR
        value: logs

      # ── Trading mode (START with False, switch to True when ready) ──
      - key: LIVE_TRADING_ENABLED
        value: "False"

      # ── Capital (start small, increase after 1 week dry-run) ──
      - key: MAX_DAILY_CAPITAL
        value: "10000"          # ₹10,000 starting capital
      - key: MAX_RISK_PER_TRADE_PCT
        value: "0.5"            # 0.5% risk per trade
      - key: DAILY_LOSS_LIMIT_PCT
        value: "2.0"            # Stop trading if daily loss > 2%

      # ── Python optimisations for Render ─────────────────────
      - key: PYTHONUNBUFFERED
        value: "1"              # Ensures logs appear in real time
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

      # ─────────────────────────────────────────────────────────
      # REQUIRED secrets — add these in Render Dashboard manually
      # Dashboard → kingtrades-bot → Environment → Add Variable
      # ─────────────────────────────────────────────────────────
      # GROWW_EMAIL           your Groww login email
      # GROWW_PASSWORD        your Groww account password
      # GROWW_TOTP_SECRET     32-char base32 TOTP secret from Groww 2FA setup
      # GROWW_AUTH_TOKEN      from Groww developer/API settings
      # TELEGRAM_BOT_TOKEN    from @BotFather on Telegram
      # TELEGRAM_CHAT_ID      your personal chat ID (use @userinfobot)
      # GEMINI_API_KEY        from https://aistudio.google.com/app/apikey
      # ─────────────────────────────────────────────────────────
      # OPTIONAL
      # NEWS_API_KEY          from https://newsapi.org (free tier works)
      # CUSTOM_WATCHLIST      RELIANCE,TCS,INFY (comma-separated, overrides default)
      # MAX_DAILY_CAPITAL     override capital here or in Dashboard
      # ─────────────────────────────────────────────────────────

    autoDeploy: true    # Re-deploy automatically on every git push to this branch
